<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - صفحة غير موجودة | Cosmixify</title>
    <!-- إضافة خط Changa -->
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #3a007d, #2e005d);
            color: #fff;
            font-family: 'Changa', sans-serif;
            text-align: center;
            padding: 0;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .container {
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            width: 90%;
            max-width: 600px;
            backdrop-filter: blur(10px);
        }
        h1 {
            font-size: 48px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ff6ec7;
        }
        p {
            font-size: 20px;
            margin-bottom: 30px;
            color: #d4d4f5;
        }
        .clipart {
            width: 100%;
            max-width: 300px;
            height: auto;
            margin-bottom: 30px;
            transition: transform 0.3s ease-in-out;
            border-radius: 10px;
        }
        .clipart:hover {
            transform: scale(1.1);
        }
        a {
            background-color: #6f00ff;
            padding: 15px 30px;
            color: #fff;
            text-decoration: none;
            font-size: 18px;
            border-radius: 8px;
            transition: background-color 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
            display: inline-block;
        }
        a:hover {
            background-color: #9c00ff;
            box-shadow: 0 6px 20px rgba(156, 0, 255, 0.6);
        }
        @media (max-width: 600px) {
            h1 {
                font-size: 32px;
            }
            p {
                font-size: 16px;
            }
            a {
                font-size: 16px;
                padding: 10px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>أوه لا! 🚀</h1>
        <p>الصفحة التي تحاول الوصول إليها غير موجودة. ربما ضاعت في الفضاء.</p>
        <!-- إضافة صورة حقيقية -->
        <img src="assets/img/404.webp" alt="Lost in space" class="clipart">
        <br><br>
        <a href="/">العودة إلى الأرض (الصفحة الرئيسية)</a>
    </div>
</body>
</html>
